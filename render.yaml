services:
  - type: web
    name: projectplanner-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://venkateshvupputuri-droid.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: projectplanner-db
          property: connectionString

databases:
  - name: projectplanner-db
    plan: free